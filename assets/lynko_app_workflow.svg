<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #0b1c30; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03c1b6" />
      <stop offset="100%" stop-color="#006a64" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Filters / Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#03c1b6" />
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Title Header -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="8" height="42" rx="4" fill="url(#primaryGrad)" />
    <text x="24" y="28" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="0.5">LYNKO APP — SYSTEM ARCHITECTURE &amp; WORKFLOW</text>
    <text x="24" y="50" fill="#94a3b8" font-size="14" font-weight="500">End-to-End Operational Lifecycle: Field Data Entry → Cloud Sync → Lab Dispatch</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 1: AUTH & ONBOARDING (Left Column) -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g transform="translate(60, 130)">
    <!-- Container -->
    <rect x="0" y="0" width="240" height="690" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="240" height="48" rx="16" fill="#1e293b" />
    <rect x="0" y="32" width="240" height="16" fill="#1e293b" />
    <text x="20" y="30" fill="#38bdf8" font-size="15" font-weight="700">1. AUTH &amp; SECURITY</text>

    <!-- Step 1.1: Sign In / Register -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="200" height="105" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="24" cy="24" r="12" fill="#03c1b6" />
      <text x="21" y="29" fill="#0b1c30" font-size="12" font-weight="bold">A</text>
      <text x="44" y="28" fill="#ffffff" font-size="14" font-weight="700">Sign In / Register</text>
      <text x="16" y="56" fill="#94a3b8" font-size="11">· Email &amp; Password Auth</text>
      <text x="16" y="74" fill="#94a3b8" font-size="11">· Auto-User Doc Generation</text>
      <text x="16" y="92" fill="#94a3b8" font-size="11">· Client-side RegEx Validation</text>
    </g>

    <!-- Down arrow -->
    <line x1="120" y1="185" x2="120" y2="210" stroke="#03c1b6" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 1.2: Email Verification -->
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="200" height="105" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="24" cy="24" r="12" fill="#03c1b6" />
      <text x="21" y="29" fill="#0b1c30" font-size="12" font-weight="bold">B</text>
      <text x="44" y="28" fill="#ffffff" font-size="14" font-weight="700">Verification Gate</text>
      <text x="16" y="56" fill="#94a3b8" font-size="11">· sendEmailVerification()</text>
      <text x="16" y="74" fill="#94a3b8" font-size="11">· Verified State Polling</text>
      <text x="16" y="92" fill="#94a3b8" font-size="11">· Secure Route Protection</text>
    </g>

    <!-- Down arrow -->
    <line x1="120" y1="335" x2="120" y2="360" stroke="#03c1b6" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 1.3: User Profile & Security -->
    <g transform="translate(20, 370)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="24" cy="24" r="12" fill="#03c1b6" />
      <text x="21" y="29" fill="#0b1c30" font-size="12" font-weight="bold">C</text>
      <text x="44" y="28" fill="#ffffff" font-size="14" font-weight="700">User Isolation</text>
      <text x="16" y="56" fill="#94a3b8" font-size="11">· Standard User Role</text>
      <text x="16" y="74" fill="#94a3b8" font-size="11">· No Global Admin Exposure</text>
      <text x="16" y="92" fill="#94a3b8" font-size="11">· Strict UID Data Silos</text>
      <text x="16" y="110" fill="#94a3b8" font-size="11">· Zero Cross-Tenant Leaks</text>
    </g>

    <!-- Info Box -->
    <g transform="translate(20, 520)">
      <rect x="0" y="0" width="200" height="140" rx="8" fill="#0b1329" stroke="#1e3a8a" stroke-dasharray="4,4" />
      <text x="14" y="26" fill="#60a5fa" font-size="12" font-weight="bold">🔒 SECURITY RULES</text>
      <text x="14" y="50" fill="#94a3b8" font-size="11">match /users/{userId} {</text>
      <text x="24" y="70" fill="#38bdf8" font-size="11">allow read, write:</text>
      <text x="24" y="88" fill="#a5f3fc" font-size="10">if request.auth.uid</text>
      <text x="36" y="106" fill="#a5f3fc" font-size="10">== userId;</text>
      <text x="14" y="126" fill="#94a3b8" font-size="11">}</text>
    </g>
  </g>

  <!-- Flow Connector: Auth to Main Workspace -->
  <path d="M 300 272 H 340" stroke="#03c1b6" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)" />

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 2: FIELD WORKSPACE & MOBILE APP (Center-Left) -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g transform="translate(350, 130)">
    <!-- Container -->
    <rect x="0" y="0" width="490" height="690" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="490" height="48" rx="16" fill="#1e293b" />
    <rect x="0" y="32" width="490" height="16" fill="#1e293b" />
    <text x="24" y="30" fill="#03c1b6" font-size="15" font-weight="700">2. FIELD INSPECTION WORKFLOW (MOBILE APP)</text>

    <!-- Screen 1: Projects List -->
    <g transform="translate(24, 70)">
      <rect x="0" y="0" width="205" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="26" fill="#ffffff" font-size="14" font-weight="700">Projects Dashboard</text>
      <text x="14" y="48" fill="#94a3b8" font-size="11">· Search by PO # / Title</text>
      <text x="14" y="68" fill="#94a3b8" font-size="11">· Live Status (Draft / Done)</text>
      <text x="14" y="88" fill="#94a3b8" font-size="11">· Address &amp; Sample Count</text>
      <rect x="14" y="105" width="177" height="30" rx="6" fill="#006a64" />
      <text x="50" y="125" fill="#ffffff" font-size="11" font-weight="bold">+ New Project (Modal)</text>
    </g>

    <!-- Arrow to CoC -->
    <line x1="229" y1="145" x2="255" y2="145" stroke="#03c1b6" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Screen 2: Chain of Custody Screen -->
    <g transform="translate(260, 70)">
      <rect x="0" y="0" width="205" height="260" rx="10" fill="#1e293b" stroke="#03c1b6" stroke-width="1.5" />
      <text x="14" y="26" fill="#03c1b6" font-size="14" font-weight="700">Chain of Custody Form</text>
      
      <rect x="12" y="40" width="181" height="50" rx="6" fill="#0b1c30" />
      <text x="20" y="58" fill="#e2e8f0" font-size="10" font-weight="bold">Project &amp; Sampling Info</text>
      <text x="20" y="76" fill="#94a3b8" font-size="9">PO #, Zip, Sampling Date/Time</text>

      <rect x="12" y="98" width="181" height="60" rx="6" fill="#0b1c30" />
      <text x="20" y="116" fill="#e2e8f0" font-size="10" font-weight="bold">Contact Info (Inline Edit)</text>
      <text x="20" y="132" fill="#94a3b8" font-size="9">Account, Name, Address, Phone</text>
      <text x="20" y="148" fill="#38bdf8" font-size="9">Sampled by: Inspector Name</text>

      <rect x="12" y="166" width="181" height="40" rx="6" fill="#0b1c30" />
      <text x="20" y="184" fill="#e2e8f0" font-size="10" font-weight="bold">Courier Touch Signature</text>
      <text x="20" y="198" fill="#4ade80" font-size="9">✓ Vector Canvas Signature</text>

      <rect x="12" y="214" width="85" height="34" rx="6" fill="#0f172a" stroke="#03c1b6" />
      <text x="25" y="235" fill="#03c1b6" font-size="10" font-weight="bold">Preview</text>

      <rect x="106" y="214" width="87" height="34" rx="6" fill="#03c1b6" />
      <text x="125" y="235" fill="#0b1c30" font-size="10" font-weight="bold">Submit</text>
    </g>

    <!-- Arrow between CoC and Edit Samples -->
    <path d="M 362 330 V 370" stroke="#03c1b6" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Screen 3: Edit Samples (Detailed Logging) -->
    <g transform="translate(24, 380)">
      <rect x="0" y="0" width="441" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" fill="#ffffff" font-size="14" font-weight="700">Sample Manager (EditSamplesScreen)</text>
      
      <!-- Sample Item Card Simulation -->
      <rect x="16" y="42" width="409" height="92" rx="8" fill="#0f172a" stroke="#475569" />
      <text x="28" y="64" fill="#38bdf8" font-size="12" font-weight="bold">Sample ID #1</text>
      <text x="130" y="64" fill="#94a3b8" font-size="11">[ Analysis 1: ✓ ]  [ Analysis 2: ✗ ]</text>
      
      <text x="28" y="86" fill="#cbd5e1" font-size="11">Description: Bedroom Drywall</text>
      <text x="230" y="86" fill="#cbd5e1" font-size="11">Prop: Bulk | Meas: 10 sq ft</text>
      
      <text x="28" y="108" fill="#a7f3d0" font-size="10">📝 Notes: Water damage near baseboard</text>
      <text x="280" y="108" fill="#fbcfe8" font-size="10">📷 Photo Attached (Camera Picker)</text>
      <text x="28" y="124" fill="#38bdf8" font-size="10">➕ Add Samples (Instant Increment)</text>
    </g>

    <!-- Bottom Bar / Offline Layer Box -->
    <g transform="translate(24, 550)">
      <rect x="0" y="0" width="441" height="115" rx="10" fill="#022c22" stroke="#059669" stroke-width="1" />
      <text x="16" y="26" fill="#34d399" font-size="13" font-weight="bold">⚡ OFFLINE-FIRST CLIENT STATE (Zustand + AsyncStorage)</text>
      <text x="16" y="50" fill="#a7f3d0" font-size="11">· Optimistic UI: Form state &amp; sample entries commit instantly locally.</text>
      <text x="16" y="70" fill="#a7f3d0" font-size="11">· Zero field latency or input lag even in basements without signal.</text>
      <text x="16" y="90" fill="#a7f3d0" font-size="11">· Auto-clears sensitive cache upon Sign Out for device sharing.</text>
    </g>
  </g>

  <!-- Flow Connector: Mobile App to Cloud / PDF -->
  <path d="M 840 272 H 880" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowGold)" />
  <path d="M 840 600 H 880" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)" />

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 3: CLOUD & OUTPUT INFRASTRUCTURE (Right Column) -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g transform="translate(890, 130)">
    <!-- Container -->
    <rect x="0" y="0" width="250" height="690" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="250" height="48" rx="16" fill="#1e293b" />
    <rect x="0" y="32" width="250" height="16" fill="#1e293b" />
    <text x="20" y="30" fill="#f59e0b" font-size="15" font-weight="700">3. CLOUD &amp; LAB DISPATCH</text>

    <!-- Cloud Sync Box -->
    <g transform="translate(18, 70)">
      <rect x="0" y="0" width="214" height="210" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="14" y="26" fill="#fbbf24" font-size="13" font-weight="bold">Google Cloud Firestore</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10">Multi-Region (nam5 US)</text>

      <rect x="12" y="60" width="190" height="40" rx="6" fill="#0b1c30" />
      <text x="20" y="78" fill="#e2e8f0" font-size="10" font-weight="bold">users/{uid}/projects</text>
      <text x="20" y="92" fill="#94a3b8" font-size="9">PO #, metadata, timestamps</text>

      <rect x="12" y="108" width="190" height="40" rx="6" fill="#0b1c30" />
      <text x="20" y="126" fill="#e2e8f0" font-size="10" font-weight="bold">users/{uid}/samples</text>
      <text x="20" y="140" fill="#94a3b8" font-size="9">Individual sample rows &amp; notes</text>

      <rect x="12" y="156" width="190" height="40" rx="6" fill="#0b1c30" />
      <text x="20" y="174" fill="#e2e8f0" font-size="10" font-weight="bold">users/{uid}/cocData</text>
      <text x="20" y="188" fill="#94a3b8" font-size="9">Contact &amp; template state</text>
    </g>

    <!-- PDF Generation Box -->
    <g transform="translate(18, 310)">
      <rect x="0" y="0" width="214" height="200" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
      <text x="14" y="26" fill="#f87171" font-size="13" font-weight="bold">PDF Generation Engine</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10">(pdfGenerator.ts)</text>

      <text x="14" y="70" fill="#cbd5e1" font-size="10">✓ HTML Sanitization (XSS-safe)</text>
      <text x="14" y="90" fill="#cbd5e1" font-size="10">✓ 15-Row Chunked Pagination</text>
      <text x="14" y="110" fill="#cbd5e1" font-size="10">✓ Alpha Env Base64 Brand Logo</text>
      <text x="14" y="130" fill="#cbd5e1" font-size="10">✓ Embedded Touch Signatures</text>
      <text x="14" y="150" fill="#cbd5e1" font-size="10">✓ Legal Terms &amp; Conditions</text>
      
      <rect x="14" y="165" width="186" height="24" rx="4" fill="#7f1d1d" />
      <text x="30" y="181" fill="#fca5a5" font-size="10" font-weight="bold">Print.printToFileAsync()</text>
    </g>

    <!-- Output Dispatch Box -->
    <g transform="translate(18, 530)">
      <rect x="0" y="0" width="214" height="135" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="14" y="26" fill="#38bdf8" font-size="13" font-weight="bold">Lab &amp; Client Dispatch</text>

      <rect x="12" y="40" width="190" height="38" rx="6" fill="#0b1c30" />
      <text x="20" y="58" fill="#38bdf8" font-size="10" font-weight="bold">📧 MailComposer</text>
      <text x="20" y="70" fill="#94a3b8" font-size="9">info@alphaenvironmental.us</text>

      <rect x="12" y="86" width="190" height="38" rx="6" fill="#0b1c30" />
      <text x="20" y="104" fill="#38bdf8" font-size="10" font-weight="bold">📤 Native Share Sheet</text>
      <text x="20" y="116" fill="#94a3b8" font-size="9">AirDrop, Print, WhatsApp, Files</text>
    </g>
  </g>

  <!-- Bottom Legend / Tech Stack Footer -->
  <g transform="translate(60, 840)">
    <text x="0" y="20" fill="#64748b" font-size="12" font-weight="600">TECH STACK: React Native (Expo v57) · TypeScript · Zustand + AsyncStorage · Google Cloud Firestore &amp; Auth · Expo-Print &amp; Sharing</text>
  </g>
</svg>
